name: Build APKViewer for Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile `
              --noconsole `
              --name APKViewer `
              --collect-all PIL `
              --hidden-import=PIL._tkinter_finder `
              --exclude-module frida `
              --exclude-module IPython `
              --exclude-module bpython `
              --exclude-module jupyter `
              --exclude-module notebook `
              --exclude-module matplotlib `
              --exclude-module networkx `
              --exclude-module numpy `
              --exclude-module pandas `
              --exclude-module scipy `
              --exclude-module pydot `
              --exclude-module pygments `
              --exclude-module tornado `
              --exclude-module PyQt5 `
              --exclude-module PySide2 `
              --exclude-module pdb `
              --exclude-module pydoc `
              --exclude-module pytest `
              --exclude-module unittest `
              --exclude-module tkinter.test `
              --exclude-module xmlrpc `
              main.py

      - name: Download and Apply UPX
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "."
          $upxExe = Get-ChildItem -Path "." -Filter "upx.exe" -Recurse | Select-Object -ExpandProperty FullName
          & $upxExe --best --lzma dist\APKViewer.exe

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APKViewer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
