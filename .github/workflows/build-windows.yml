name: Build Windows APK Viewer

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile `
              --noconsole `
              --name APKViewer `
              --collect-all androguard `
              --collect-all PIL `
              --hidden-import=PIL._tkinter_finder `
              main.py

      - name: Download and Apply UPX (Windows)
        run: |
          # Descargar UPX oficialmente en Windows de forma automática
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "."
          $upxExe = Get-ChildItem -Path "." -Filter "upx.exe" -Recurse | Select-Object -ExpandProperty FullName
          
          & $upxExe --best --lzma dist\APKViewer.exe

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APKViewer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
