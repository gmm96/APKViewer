name: '[Windows] Build APKViewer'

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: ${{ vars.WINDOWS_VERSION }}
    permissions:
      contents: write

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install Python dependencies'
        run: |
          & "$env:pythonLocation\python.exe" -m pip install --upgrade pip
          & "$env:pythonLocation\python.exe" -m pip install -r requirements.txt
          & "$env:pythonLocation\python.exe" -m pip install nuitka zstandard

      - name: 'Cache Nuitka'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: 'Build executable with Nuitka'
        run: |
          & "$env:pythonLocation\python.exe" -m nuitka `
              --standalone `
              --onefile `
              --assume-yes-for-downloads `
              --output-dir=dist `
              --output-filename=APKViewer-windows.exe `
              --windows-console-mode=attach `
              --include-package-data=androguard `
              --include-data-dir=assets=assets `
              --enable-plugin=tk-inter `
              --nofollow-import-to=frida `
              --lto=yes `
              main.py

      - name: 'Upload binary to release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APKViewer-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
