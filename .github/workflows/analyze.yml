name: 'Linting & Type Analysis'
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  pylint:
    name: 'Linting: Pylint'
    runs-on: ${{ vars.LINUX_VERSION }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: 'Run Pylint'
        env:
          PYTHONPATH: .
        run: |
          pylint main.py apkviewer/ || [ $(($? & 3)) -eq 0 ]

  mypy:
    name: 'Type Checking: Mypy'
    runs-on: ${{ vars.LINUX_VERSION }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -r requirements.txt

      - name: 'Run Mypy'
        run: |
          mypy --install-types --non-interactive --explicit-package-bases main.py apkviewer/ || true
          mypy --explicit-package-bases --ignore-missing-imports main.py apkviewer/
