name: 'Linting & Type Analysis'
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  pylint:
    name: '[Pylint] Linting for ${{ matrix.os.name }}'
    runs-on: ${{ matrix.os.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: 'Linux'
            runner: ${{ vars.LINUX_VERSION }}
            ignore: '.*windows_.*,.*macos_.*'
          - name: 'MacOS'
            runner: ${{ vars.MACOS_VERSION }}
            ignore: '.*linux_.*,.*windows_.*'
          - name: 'Windows'
            runner: ${{ vars.WINDOWS_VERSION }}
            ignore: '.*linux_.*,.*macos_.*'
            
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install Python dependencies'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: 'Run Pylint'
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          python -c "import sys, subprocess; ignore='${{ matrix.os.ignore }}'; args=['pylint', 'main.py', 'apkviewer/']; ignore and args.extend(['--ignore-paths', ignore]); sys.exit(subprocess.run(args).returncode & 3)"


  mypy:
    name: '[Mypy] ${{ matrix.os.name }}'
    runs-on: ${{ matrix.os.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: 'Linux'
            runner: ${{ vars.LINUX_VERSION }}
            exclude: '--exclude "windows_" --exclude "macos_"'
          - name: 'MacOS'
            runner: ${{ vars.MACOS_VERSION }}
            exclude: '--exclude "linux_" --exclude "windows_"'
          - name: 'Windows'
            runner: ${{ vars.WINDOWS_VERSION }}
            exclude: '--exclude "linux_" --exclude "macos_"'
            
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install Python dependencies'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -r requirements.txt

      - name: 'Install Mypy required types'
        shell: bash
        run: |
          mypy --install-types --non-interactive --explicit-package-bases main.py apkviewer/ || true

      - name: 'Run Mypy'
        shell: bash
        run: |
          mypy --explicit-package-bases --ignore-missing-imports ${{ matrix.os.exclude }} main.py apkviewer/
